name: GreenOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      simulated_intensity:
        description: 'Simulated Grid Carbon Intensity (gCO2/kWh)'
        required: true
        default: '100'
        type: string

jobs:
  carbon-gate:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.set-mode.outputs.mode }}
      intensity: ${{ steps.set-mode.outputs.intensity }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Carbon Decision Engine
        id: set-mode
        env:
          SIMULATE_INTENSITY: ${{ github.event.inputs.simulated_intensity || '100' }}
        run: |
          python scheduler/decide.py

  test-and-lint:
    needs: carbon-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest

      - name: Run Linting
        run: |
          flake8 app scheduler --max-line-length=160

  deploy-or-trim:
    needs: [carbon-gate, test-and-lint]
    runs-on: ubuntu-latest
    if: needs.carbon-gate.outputs.mode != 'red'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Log Execution & CO2 Estimate
        env:
          MODE: ${{ needs.carbon-gate.outputs.mode }}
          INTENSITY: ${{ needs.carbon-gate.outputs.intensity }}
        run: |
          python -c "from scheduler.estimate import log_run; log_run('$MODE', float('$INTENSITY'), 5.0)"

          git config --global user.name 'GreenOps Bot'
          git config --global user.email 'bot@greenops.local'

          # Stage runs.csv with -f to override any .gitignore rule that may
          # exist on the branch being checked out.  This is a no-op if the
          # file is not ignored, and safe if it is.
          git add -f data/runs.csv

          # Only commit when there is actually something staged.
          # `git diff --cached --quiet` exits 0 (no diff) or 1 (changes staged).
          if ! git diff --cached --quiet; then
            git commit -m "ci: auto-log run emissions [skip ci]"
            git push
          else
            echo "No staged changes to commit — runs.csv unchanged or empty."
          fi
